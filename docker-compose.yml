services:
  sola:
    build:
      context: .
    image: sola:latest
    container_name: sola
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      # Named volume holds config.json + sola.db (history) across restarts.
      # Data sources (your Victron Venus OS and MadBus endpoints) are edited in
      # the web UI under Settings → Data Sources — no connection IPs live here.
      - sola-data:/data

volumes:
  sola-data:
